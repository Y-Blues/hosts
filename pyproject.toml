[project]
name = "ycappuccino-hosts"
version = "0.1.0"
description = "YCappuccino hosts: serves static files from prioritized, optionally Basic-Auth-protected filesystem directories"
requires-python = ">=3.10"
dependencies = [
    "ycappuccino-api",
    "ycappuccino-core",
    "ycappuccino-storage",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ycappuccino.hosts"
module-root = "src/main/python"

[tool.uv.sources]
ycappuccino-api = { path = "../api", editable = true }
ycappuccino-core = { path = "../core", editable = true }
ycappuccino-storage = { path = "../storage", editable = true }
